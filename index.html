<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>十八岁，生日快乐 · 11.28</title>
<style>
  :root{
    --cream:#FBF7F2;
    --ink:#4B3B35;
    --muted:#9A857B;
    --rose:#D79A93;
    --rose-deep:#C27F79;
    --sage:#A8B8A4;
    --gold:#D8B98D;
    --line:rgba(120,90,76,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  button:focus{outline:none}
  button:focus-visible{outline:2px solid rgba(214,154,147,.55);outline-offset:2px}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--cream);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:radial-gradient(120% 90% at 50% -12%,#FFFDFA 0%,#FAF3EE 52%,#F5EBE5 100%);}
  .blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.42;animation:drift 20s ease-in-out infinite alternate}
  .blob.b1{width:46vw;height:46vw;min-width:280px;min-height:280px;background:#F6CBC4;left:-14vw;top:8vh}
  .blob.b2{width:40vw;height:40vw;min-width:240px;min-height:240px;background:#D8E3D2;right:-12vw;top:24vh;animation-delay:-7s}
  .blob.b3{width:34vw;height:34vw;min-width:220px;min-height:220px;background:#F3DDB6;left:34vw;bottom:-16vw;animation-delay:-13s}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(22px,-30px,0) scale(1.08)}}

  .topbar{max-width:1080px;margin:0 auto;padding:22px 26px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;color:var(--muted)}
  .brand-mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(145deg,#E8C79A,#D3A97C);color:#fff;font:italic 14px Georgia,serif;letter-spacing:0;
    box-shadow:0 6px 16px rgba(190,150,105,.24)}
  .copy-link{border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--muted);
    border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;transition:.2s}
  .copy-link:hover{background:#fff;color:var(--rose-deep);border-color:rgba(214,154,147,.4)}

  main{max-width:1080px;margin:0 auto;padding:0 20px 60px;text-align:center}
  .hero{padding:26px 0 4px}
  .eyebrow{margin:0 0 14px;font:11px Georgia,serif;letter-spacing:.38em;color:#B8948A;text-transform:uppercase}
  h1{margin:0;font-family:Georgia,"Songti SC","STSong",serif;font-weight:500;
    font-size:clamp(34px,6.4vw,60px);line-height:1.24;letter-spacing:.04em;color:#493A34}
  h1 em{font-style:italic;color:var(--rose-deep)}
  .sub{margin:16px auto 0;max-width:560px;font-size:13px;line-height:1.9;color:var(--muted);letter-spacing:.03em}
  .sub strong{font-weight:600;color:var(--rose-deep)}
  .hint{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 16px;border-radius:999px;
    background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:#9A7F74;font-size:12px;
    box-shadow:0 8px 24px rgba(150,115,100,.08)}
  .hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rose);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35;transform:scale(.7)}}

  .stage{position:relative;width:min(100%,900px);height:510px;margin:6px auto 0}
  .notes-layer{position:absolute;inset:0;z-index:2;pointer-events:none}
  .note{position:absolute;width:158px;min-height:64px;padding:11px 13px 12px;border:0;border-radius:14px;
    background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 14px 34px rgba(124,92,78,.13),0 2px 6px rgba(124,92,78,.06);
    transform:rotate(var(--rot));text-align:left;cursor:pointer;pointer-events:auto;
    transition:box-shadow .25s ease,filter .25s ease}
  .note:hover{box-shadow:0 18px 42px rgba(124,92,78,.2);filter:brightness(1.02)}
  .note-inner{display:block;pointer-events:none;animation:floaty var(--dur,6s) ease-in-out var(--delay,0s) infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .tape{position:absolute;left:50%;top:-7px;width:52px;height:15px;margin-left:-26px;transform:rotate(-3deg);
    background:rgba(224,196,154,.52);border-radius:2px;box-shadow:0 1px 2px rgba(140,110,80,.08)}
  .note-name{display:block;font-size:10px;letter-spacing:.08em;color:#B08C82;margin-bottom:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note-text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    font-size:12px;line-height:1.65;color:#5C4A43}
  .note-img{display:block;width:100%;height:44px;margin-top:8px;border-radius:8px;background-size:cover;background-position:center}
  .notes-canvas{position:absolute;inset:0}
  .stage.cake-away .cake-slot{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(28px)}
  .stage.cake-away .notes-layer{overflow-y:auto;pointer-events:auto;
    scrollbar-width:thin;scrollbar-color:rgba(190,150,130,.35) transparent}
  .stage.cake-away .notes-layer::-webkit-scrollbar{width:6px}
  .stage.cake-away .notes-layer::-webkit-scrollbar-thumb{background:rgba(190,150,130,.35);border-radius:99px}

  .cake-slot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(440px,94vw);z-index:5}
  .cake-button{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;position:relative}
  .cake-button:disabled{cursor:default;pointer-events:none}
  .cake-art svg{width:100%;height:auto;display:block;overflow:visible;animation:cakeFloat 5.5s ease-in-out infinite}
  @keyframes cakeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .cake-button:not(:disabled):hover svg{filter:drop-shadow(0 16px 22px rgba(185,135,118,.16))}
  .slice{transform-origin:300px 215px;transition:transform .95s cubic-bezier(.18,.85,.28,1),opacity .8s ease .12s}
  .cake-art.cut .slice{transform:translate(96px,-58px) rotate(16deg);opacity:0}
  .cut-face{opacity:0;transition:opacity .35s ease .3s}
  .cake-art.cut .cut-face{opacity:1}
  .flame{transform-box:fill-box;transform-origin:center bottom;animation:flicker 1.15s ease-in-out infinite alternate}
  .flame.f2{animation-duration:1.45s;animation-delay:-.5s}
  @keyframes flicker{from{transform:scale(.92) rotate(-3deg);opacity:.86}to{transform:scale(1.08) rotate(3deg);opacity:1}}
  .sparkle{animation:twinkle 2.6s ease-in-out infinite}
  .sparkle.s2{animation-delay:-.9s}.sparkle.s3{animation-delay:-1.7s}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

  .bottom{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:18px}
  .ghost{border:1px solid rgba(214,154,147,.3);background:rgba(255,255,255,.6);color:#A57D76;
    border-radius:999px;padding:10px 20px;font-size:12px;cursor:pointer;transition:.2s}
  .ghost:hover{background:#fff;color:var(--rose-deep);transform:translateY(-1px)}
  .foot-note{margin:14px 0 0;font-size:11px;color:#B29C91;letter-spacing:.06em}

  .serve-scene{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    gap:22px;padding:20px;pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .5s ease,visibility .5s ease}
  .serve-scene.show{opacity:1;visibility:visible}
  .serve-plate{position:relative;width:min(300px,64vw);filter:drop-shadow(0 22px 26px rgba(130,96,80,.18))}
  .serve-scene.show .serve-plate{animation:servePlate 1.05s cubic-bezier(.2,.86,.28,1) both}
  .serve-scene.eating .serve-plate{pointer-events:auto;cursor:pointer}
  .serve-scene.eating .serve-plate:hover{filter:drop-shadow(0 18px 24px rgba(185,135,118,.28))}
  .served-slice{transition:opacity .4s ease}
  .bite-marks{transition:opacity .35s ease}
  .bite-mark{opacity:0;transition:opacity .32s ease}
  .bite-mark.on{opacity:1}
  .serve-plate.munch svg{animation:munch .26s ease}
  @keyframes munch{0%{transform:scale(1)}45%{transform:scale(.965)}100%{transform:scale(1)}}
  .bite-hint{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;
    font-size:12px;color:#A57D76;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 13px;
    box-shadow:0 8px 20px rgba(130,96,80,.12);opacity:0;transition:opacity .3s ease}
  .serve-scene.eating .bite-hint{opacity:1}
  .serve-text{font-family:Georgia,"Songti SC","STSong",serif;font-size:clamp(17px,3.2vw,25px);
    letter-spacing:.07em;color:#A4766E;white-space:nowrap;text-shadow:0 2px 12px rgba(255,255,255,.95);
    margin-left:64px}
  .serve-scene.show .serve-text{animation:serveText .7s .42s both}
  @keyframes servePlate{
    0%{transform:translateY(-110px) scale(.42) rotate(-9deg);opacity:0}
    55%{transform:translateY(22px) scale(1.07) rotate(3deg);opacity:1}
    100%{transform:translateY(0) scale(1) rotate(0);opacity:1}
  }
  @keyframes serveText{
    0%{opacity:0;transform:translateX(-14px)}
    100%{opacity:1;transform:translateX(0)}
  }

  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;
    background:rgba(72,54,46,.26);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
  .modal.show{opacity:1;visibility:visible}
  .dialog{width:min(440px,100%);max-height:min(88vh,720px);overflow:auto;background:#FFFDFA;
    border-radius:24px;padding:28px 28px 26px;box-shadow:0 26px 70px rgba(78,55,45,.22);
    transform:translateY(14px) scale(.985);transition:transform .3s cubic-bezier(.2,.8,.3,1)}
  .modal.show .dialog{transform:none}
  .dialog h2{margin:0 0 6px;font-family:Georgia,"Songti SC",serif;font-size:23px;font-weight:500;color:#4B3B35}
  .dialog .desc{margin:0 0 20px;font-size:12px;color:#A48F85;line-height:1.7}
  .field{display:block;margin-bottom:14px;text-align:left}
  .field span{display:block;font-size:11px;color:#9B857B;letter-spacing:.08em;margin-bottom:7px}
  input[type=text],textarea{width:100%;border:1px solid var(--line);background:#FDF9F6;border-radius:12px;
    padding:12px 14px;font:inherit;font-size:13px;color:var(--ink);outline:none;transition:.2s;resize:vertical}
  textarea{min-height:104px;line-height:1.7}
  input[type=text]:focus,textarea:focus{border-color:rgba(214,154,147,.6);background:#fff;box-shadow:0 0 0 3px rgba(214,154,147,.12)}
  .upload{display:flex;align-items:center;gap:12px;border:1px dashed rgba(190,160,140,.45);border-radius:12px;
    padding:10px;background:#FDF9F6;cursor:pointer}
  .upload:hover{border-color:var(--rose);background:#FFF8F4}
  .upload .plus{width:42px;height:42px;flex:none;border-radius:10px;display:grid;place-items:center;
    background:#F5E7DF;color:#B7847C;font-size:20px;line-height:1}
  .upload .txt{font-size:12px;color:#9B857B;line-height:1.6}
  .upload input{display:none}
  .preview-wrap{position:relative;margin-top:10px}
  .preview{width:100%;height:120px;border-radius:12px;background-size:cover;background-position:center;
    background-color:#F3E9E2;border:1px solid var(--line)}
  .remove-img{position:absolute;top:8px;right:8px;border:0;border-radius:999px;padding:5px 10px;
    background:rgba(60,45,40,.55);color:#fff;font-size:11px;cursor:pointer}
  .actions{display:flex;gap:10px;margin-top:20px}
  .primary,.secondary{flex:1;border:0;border-radius:999px;padding:12px 16px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
  .primary{background:linear-gradient(135deg,#DEA69E,#C9857E);color:#fff;box-shadow:0 10px 22px rgba(201,133,126,.24)}
  .primary:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .secondary{background:#F4ECE6;color:#9A7F74}
  .secondary:hover{background:#EDDFD6}
  .detail-img{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin:4px 0 18px;background:#F3E9E2}
  .detail-text{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.95;color:#55443E;
    background:#FBF5F0;border-radius:14px;padding:16px 18px;text-align:left}
  .detail-meta{margin-top:12px;font-size:11px;color:#B09A90;letter-spacing:.05em}
  .link-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;text-align:left}
  .list-item{width:100%;border:1px solid var(--line);background:#FDF9F6;border-radius:14px;padding:12px 14px;
    text-align:left;cursor:pointer;transition:.2s}
  .list-item:hover{background:#fff;border-color:rgba(214,154,147,.45)}
  .list-item b{display:block;font-size:11px;color:#B08C82;font-weight:500;margin-bottom:4px}
  .list-item p{margin:0;font-size:12px;line-height:1.6;color:#5C4A43;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .danger{margin-top:18px;border:0;background:none;color:#B98E88;font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .close-x{position:absolute;top:16px;right:18px;border:0;background:none;color:#B29C91;font-size:22px;cursor:pointer;line-height:1}
  .dialog{position:relative}

  .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);z-index:70;
    background:rgba(72,54,46,.9);color:#FFF8F2;border-radius:999px;padding:11px 20px;font-size:12px;
    opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .confetti{position:fixed;z-index:60;width:8px;height:14px;border-radius:3px;pointer-events:none;
    animation:burst 1.7s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes burst{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    45%{transform:translate(var(--dx1),var(--dy1)) rotate(220deg);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(560deg);opacity:0}}

  @media(max-width:700px){
    .topbar{padding:16px 16px 0}
    main{padding:0 14px 46px}
    .hero{padding:18px 0 0}
    .eyebrow{font-size:9px;letter-spacing:.3em}
    .sub{font-size:12px;line-height:1.8}
    .stage{height:420px;margin-top:2px}
    .note{width:112px;min-height:52px;padding:8px 9px 9px;border-radius:11px}
    .tape{width:38px;height:11px;margin-left:-19px;top:-5px}
    .note-name{font-size:9px;margin-bottom:3px}
    .note-text{font-size:10px;line-height:1.5;-webkit-line-clamp:3}
    .note-img{height:30px;margin-top:5px}
    .cake-slot{width:min(360px,96vw)}
    .serve-scene{flex-direction:column;gap:8px}
    .serve-plate{width:min(270px,78vw)}
    .serve-text{font-size:17px;margin-left:0}
    .dialog{padding:24px 20px 22px;border-radius:20px}
    .bottom{gap:10px}
  }
  @media(max-width:420px){
    h1{font-size:31px}
    .brand span:last-child{font-size:10px;letter-spacing:.06em}
    .copy-link{padding:7px 10px;font-size:11px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<header class="topbar">
  <div class="brand"><span class="brand-mark">18</span><span>ADULT CEREMONY · 11.28</span></div>
  <button class="copy-link" id="copyLink" type="button">复制页面链接</button>
</header>

<main>
  <section class="hero">
    <p class="eyebrow">Happy 18th Birthday</p>
    <h1>十八岁，<em>生日快乐</em></h1>
    <p class="sub">从今天起，允许自己成为更自由的大人。<br>
      <strong id="dateLine">11 月 28 日</strong> · <span id="countdown">正在计算日子…</span></p>
    <div class="hint" id="hint">轻触蛋糕，切开今天的第一块甜</div>
  </section>

  <section class="stage" id="stage" aria-label="生日蛋糕与祝福">
    <div class="notes-layer" id="notesLayer"><div class="notes-canvas" id="notesCanvas"></div></div>
    <div class="cake-slot">
      <button class="cake-button" id="cakeBtn" type="button" aria-label="点击切开生日蛋糕">
        <span class="cake-art" id="cakeArt">
          <svg viewBox="0 0 440 340" role="img" aria-label="精致的十八岁生日蛋糕">
            <defs>
              <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFF8F0"/><stop offset="1" stop-color="#F2D9C7"/>
              </linearGradient>
              <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FBDAD4"/><stop offset="1" stop-color="#EAB5B1"/>
              </linearGradient>
              <linearGradient id="inside" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#F1D1BE"/><stop offset="1" stop-color="#FFEFE1"/>
              </linearGradient>
              <radialGradient id="halo">
                <stop offset="0" stop-color="#F3C6B5" stop-opacity=".5"/>
                <stop offset="1" stop-color="#F3C6B5" stop-opacity="0"/>
              </radialGradient>
              <pattern id="stripe" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
                <rect width="5" height="11" fill="#E6B2A7"/>
              </pattern>
              <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="9"/>
              </filter>
              <g id="cakeSliceArt">
                <rect x="248" y="118" width="52" height="54" rx="10" fill="url(#pink)"/>
                <g fill="#FFF8F1">
                  <rect x="248" y="110" width="52" height="18" rx="8"/>
                  <circle cx="252" cy="128" r="8"/><circle cx="272" cy="128" r="8"/><circle cx="292" cy="128" r="8"/>
                </g>
                <g fill="#FFFFFF" opacity=".7">
                  <rect x="262" y="146" width="4" height="8" rx="2" transform="rotate(-22 264 150)"/>
                  <rect x="284" y="152" width="4" height="8" rx="2" transform="rotate(26 286 156)"/>
                </g>
                <rect x="248" y="168" width="96" height="92" rx="14" fill="url(#cream)"/>
                <rect x="248.5" y="168.5" width="95" height="91" rx="13.5" fill="none" stroke="#E8C9B6" stroke-opacity=".5"/>
                <g fill="#FFF8F1">
                  <rect x="248" y="160" width="96" height="20" rx="9"/>
                  <circle cx="252" cy="180" r="10"/><circle cx="280" cy="180" r="10"/>
                  <circle cx="308" cy="180" r="10"/><circle cx="332" cy="180" r="10"/>
                </g>
                <g fill="#D9A79C" opacity=".75">
                  <rect x="270" y="210" width="4" height="10" rx="2" transform="rotate(28 272 215)"/>
                  <rect x="300" y="238" width="4" height="10" rx="2" transform="rotate(-24 302 243)"/>
                </g>
                <path d="M278 108 C274 101 276 96 282 96 C288 96 290 101 286 108 Z" fill="#E78E93"/>
                <path d="M283 95 C289 90 296 92 298 96 C294 101 287 100 283 95Z" fill="#A9BEA3"/>
              </g>
            </defs>

            <ellipse cx="220" cy="188" rx="188" ry="142" fill="url(#halo)"/>
            <ellipse cx="222" cy="296" rx="146" ry="17" fill="#B99C8A" opacity=".22" filter="url(#soft)"/>
            <ellipse cx="220" cy="290" rx="150" ry="18" fill="#EADCD1"/>
            <ellipse cx="220" cy="286" rx="150" ry="17" fill="#FFFCF8"/>
            <ellipse cx="220" cy="283" rx="112" ry="10" fill="#F6EAE1" opacity=".85"/>

            <g class="sparkle" fill="#DDB98F"><circle cx="86" cy="92" r="3"/></g>
            <g class="sparkle s2" fill="#DCA6A0"><circle cx="356" cy="70" r="2.6"/></g>
            <g class="sparkle s3" fill="#B3C2AE"><circle cx="380" cy="150" r="2.4"/></g>

            <g>
              <rect x="182" y="60" width="12" height="64" rx="6" fill="#FAEEE5"/>
              <rect x="182" y="60" width="12" height="64" rx="6" fill="url(#stripe)" opacity=".65"/>
              <rect x="226" y="60" width="12" height="64" rx="6" fill="#FAEEE5"/>

<script src="mqtt.min.js"></script>
<script>
(function(){

  var notesLayer=$('notesLayer'), notesCanvas=$('notesCanvas'), cakeBtn=$('cakeBtn'), cakeArt=$('cakeArt');
  var hint=$('hint'), allBtn=$('allBtn'), countEl=$('count');
  var formModal=$('formModal'), detailModal=$('detailModal'), allModal=$('allModal');
  var nameInput=$('nameInput'), textInput=$('textInput'), imageInput=$('imageInput');
  var preview=$('preview'), previewWrap=$('previewWrap'), submitBtn=$('submitBtn');
  var detailBody=$('detailBody'), detailTitle=$('detailTitle'), allList=$('allList');
  var toastEl=$('toast'), deleteBtn=$('deleteBtn'), clearBtn=$('clearBtn');
  var serveScene=$('serveScene'), servePlate=$('servePlate'), servedSlice=$('servedSlice'), biteHint=$('biteHint');
  var stage=$('stage');
  var deviceId='';

    deviceId=localStorage.getItem('b18_device_id')||'';

  }catch(e){deviceId='d'+Date.now().toString(36);}
  var pendingImg='', currentDetailId=null, detailFromAll=false, cut=false, toastTimer=null, resizeTimer=null;

  function loadNotes(){

      var raw=localStorage.getItem(KEY);
      if(raw){var arr=JSON.parse(raw);if(Array.isArray(arr))return arr;}
    }catch(e){}
    return DEMO.slice();
  }
  var notes=loadNotes();
  function saveNotes(){
    try{localStorage.setItem(KEY,JSON.stringify(notes));return true;}catch(e){return false;}
  }
  var wallStatus=$('wallStatus'), SHARED_TOPIC='birthday18/siyu-2026-notes-v2';
  var ADMIN_KEY='b18-admin-8d41f6c2', isAdmin=false;
  try{
    var adminParam=new URLSearchParams(location.search).get('admin');
    if(adminParam===ADMIN_KEY){localStorage.setItem('b18_admin',ADMIN_KEY);history.replaceState(null,'',location.pathname);}
    isAdmin=localStorage.getItem('b18_admin')===ADMIN_KEY;
  }catch(e){}
  var adminTaps=0, adminTapTimer=null;
  var brandMark=document.querySelector('.brand-mark');
  if(brandMark)brandMark.addEventListener('click',function(){
    adminTaps++;
    clearTimeout(adminTapTimer);
    adminTapTimer=setTimeout(function(){adminTaps=0;},4000);
    if(adminTaps>=5){
      adminTaps=0;
      isAdmin=true;
      try{localStorage.setItem('b18_admin',ADMIN_KEY);}catch(e){}
      toast('已进入管理模式');
      setWallStatus('已连接，实时同步中');
    }
  });
  var mqttClient=null, sharedReady=false, brokerTimer=null;
  var BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.hivemq.com:443/mqtt','wss://broker.emqx.io:8084/mqtt'];
  function setWallStatus(text){if(wallStatus)wallStatus.textContent=text+(isAdmin?'（管理模式）':'');}
  var sharedGot=false, ntfyOnline=false, NTFY_TOPIC='birthday18-siyu-2026-9f4c2a7e';
  function noteTopic(id){return SHARED_TOPIC+'/note/'+id;}
  function ntfyApply(data){
    if(!data||data.event!=='message')return;
    var obj=null;
    try{obj=JSON.parse(data.message);}catch(e){return;}
    if(!obj)return;
    if(obj.type==='delete'&&obj.id){
      notes=notes.filter(function(n){return n.id!==obj.id;});
      saveNotes();renderNotes();return;
    }
    var n=obj.note||obj;
    if(!n||!n.id)return;
    mergeSharedNote(n);
  }
  function ntfyPoll(since){
    fetch('https://ntfy.sh/'+NTFY_TOPIC+'/json?poll=1&since='+(since||'12h'),{cache:'no-store'})
      .then(function(r){return r.text();})
      .then(function(txt){
        ntfyOnline=true;
        if(!mqttClient||!mqttClient.connected)setWallStatus('已连接（HTTPS 同步）');
        txt.split('\n').forEach(function(line){
          if(!line.trim())return;
          try{ntfyApply(JSON.parse(line));}catch(e){}
        });
      }).catch(function(){if(!mqttClient||!mqttClient.connected)setWallStatus('离线，祝福暂存在本机');});
  }
  function initNtfy(){
    ntfyPoll('12h');
    try{
      var es=new EventSource('https://ntfy.sh/'+NTFY_TOPIC+'/sse');
      es.onmessage=function(ev){try{ntfyApply(JSON.parse(ev.data));}catch(e){}};
    }catch(e){}
    setInterval(function(){ntfyPoll('2m');},15000);
  }
  function ntfyPublish(note){
    if(!note||!note.id)return;
    var out={id:note.id,name:note.name,text:note.text,time:note.time,img:''};
    fetch('https://ntfy.sh/'+NTFY_TOPIC,{method:'POST',body:JSON.stringify(out)}).catch(function(){});
  }
  function ntfyDelete(id){
    if(!id)return;
    fetch('https://ntfy.sh/'+NTFY_TOPIC,{method:'POST',body:JSON.stringify({type:'delete',id:id})}).catch(function(){});
  }
  function publishNote(n){
    if(mqttClient&&mqttClient.connected&&n&&n.id){
      try{mqttClient.publish(noteTopic(n.id),JSON.stringify(n),{qos:0,retain:true});}catch(e){}
    }
  }
  function removeNoteTopic(id){
    if(mqttClient&&mqttClient.connected&&id){
      try{mqttClient.publish(noteTopic(id),'',{qos:0,retain:true});}catch(e){}
    }
  }
  function mergeSharedNote(n){
    if(!n||!n.id)return;
    var found=false;
    for(var i=0;i<notes.length;i++){
      if(notes[i].id===n.id){if(!n.img&&notes[i].img)n.img=notes[i].img;notes[i]=n;found=true;break;}
    }
    if(!found)notes.push(n);
    notes.sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''));});
    saveNotes();renderNotes();
  }
  function seedShared(){
    if(!mqttClient||!mqttClient.connected)return;
    notes.forEach(function(n){publishNote(n);});
  }
  function initShared(index){
    if(typeof mqtt==='undefined'){
      setWallStatus('正在加载祝福墙…');
      var s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/mqtt@4.3.8/dist/mqtt.min.js';
      s.onload=function(){initShared(0);};
      s.onerror=function(){setWallStatus('离线，祝福暂存在本机');};
      document.head.appendChild(s);
      return;
    }
    var idx=index||0;
    if(idx>=BROKERS.length){if(!ntfyOnline)setWallStatus('离线，祝福暂存在本机');return;}
    setWallStatus('正在连接祝福墙…（'+(idx+1)+'/'+BROKERS.length+'）');
    try{
      if(mqttClient){try{mqttClient.end(true);}catch(e){}mqttClient=null;}
      var connected=false;
      mqttClient=mqtt.connect(BROKERS[idx],{
        clientId:'b18-'+Math.random().toString(16).slice(2,10),
        clean:true,reconnectPeriod:4000,connectTimeout:8000
      });
      clearTimeout(brokerTimer);
      brokerTimer=setTimeout(function(){
        if(!connected){try{mqttClient.end(true);}catch(e){}initShared(idx+1);}
      },9000);
      mqttClient.on('connect',function(){
        connected=true;clearTimeout(brokerTimer);
        setWallStatus('已连接，实时同步中');
        mqttClient.subscribe(SHARED_TOPIC+'/note/+',{qos:0},function(err){
          if(err)return;
          setTimeout(function(){if(!sharedGot)seedShared();},1600);
        });
      });
      mqttClient.on('message',function(topic,payload){
        var prefix=SHARED_TOPIC+'/note/';
        if(topic.indexOf(prefix)!==0)return;
        var id=topic.slice(prefix.length);
        if(!payload.length){
          notes=notes.filter(function(n){return n.id!==id;});
          saveNotes();renderNotes();
          return;
        }
        try{
          var n=JSON.parse(payload.toString());
          if(!n||!n.id)return;
          sharedGot=true;mergeSharedNote(n);
        }catch(e){}
      });
      mqttClient.on('error',function(){
        if(!connected){clearTimeout(brokerTimer);try{mqttClient.end(true);}catch(e){}initShared(idx+1);}
        else if(!ntfyOnline)setWallStatus('连接中断，正在重连…');
      });
      mqttClient.on('offline',function(){if(connected&&!ntfyOnline)setWallStatus('连接中断，正在重连…');});
      mqttClient.on('reconnect',function(){setWallStatus('正在重连祝福墙…');});
    }catch(e){initShared(idx+1);}
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function nowText(){
    var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
    return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function toast(msg){
    toastEl.textContent=msg;toastEl.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2600);
  }
  function getSlots(){
    if(window.innerWidth<700){
      return [
        {l:'0%',t:'0%',r:-8},{l:'63%',t:'1%',r:7},
        {l:'2%',t:'23%',r:6},{l:'64%',t:'25%',r:-7},
        {l:'0%',t:'46%',r:-5},{l:'65%',t:'47%',r:8},
        {l:'3%',t:'69%',r:7},{l:'66%',t:'70%',r:-6}
      ];
    }
    return [
      {l:'2%',t:'0%',r:-8},{l:'19%',t:'9%',r:5},
      {l:'36%',t:'0%',r:-4},{l:'53%',t:'8%',r:6},
      {l:'70%',t:'0%',r:-6},{l:'84%',t:'13%',r:8},
      {l:'8%',t:'28%',r:6},{l:'88%',t:'33%',r:-5}
    ];
  }
  function renderNotes(){
    notesCanvas.innerHTML='';
    var slots=getSlots(), wallMode=stage.classList.contains('cake-away');
    var visible=wallMode?notes.slice():notes.slice(-8);
    var order=window.innerWidth<700?[0,1,2,3,4,5,6,7]:[0,4,2,6,1,5,3,7];
    var perRow=window.innerWidth<700?2:3;
    if(wallMode){
      var rows=Math.ceil(visible.length/perRow);
      notesCanvas.style.height=Math.max(window.innerWidth<700?420:510,60+rows*150)+'px';
    }else{
      notesCanvas.style.height='';
    }
    visible.forEach(function(n,i){
      var btn=document.createElement('button');
      btn.type='button';btn.className='note';
      if(wallMode){
        var col=i%perRow,row=Math.floor(i/perRow);
        var mobileView=window.innerWidth<700;
        var baseLeft=mobileView?(col===0?1:51):(col===0?1:(col===1?34:67));
        btn.style.left=(baseLeft+(((i*29)%7)-3))+'%';
        btn.style.top=(12+row*150+(((i*41)%31)-15))+'px';
        btn.style.setProperty('--rot',(((i*23)%13)-6)+'deg');
        btn.style.width=((mobileView?104:150)+((i*7)%(mobileView?12:14)))+'px';
      }else{
        var s=slots[order[i%order.length]];
        btn.style.left=s.l;btn.style.top=s.t;btn.style.setProperty('--rot',s.r+'deg');
      }
      btn.style.setProperty('--dur',(5.2+i*0.55).toFixed(2)+'s');
      btn.style.setProperty('--delay',(-i*0.73).toFixed(2)+'s');
      var inner=document.createElement('span');inner.className='note-inner';
      var tape=document.createElement('span');tape.className='tape';inner.appendChild(tape);
      var name=document.createElement('span');name.className='note-name';
      name.textContent=(n.name?n.name+' 的祝福':'一位匿名朋友的祝福');inner.appendChild(name);
      var text=document.createElement('span');text.className='note-text';text.textContent=n.text;inner.appendChild(text);
      if(n.img){var im=document.createElement('span');im.className='note-img';im.style.backgroundImage='url("'+n.img+'")';inner.appendChild(im);}
      btn.appendChild(inner);
      btn.addEventListener('click',function(){openDetail(n.id);});
      notesCanvas.appendChild(btn);
    });
    countEl.textContent=notes.length;
    allBtn.hidden=notes.length===0;
  }
  function openModal(el){el.classList.add('show');}
  function closeModal(el){el.classList.remove('show');}
  function closeDetail(){
    var back=detailFromAll;
    closeModal(detailModal);detailFromAll=false;
    if(back)openAll();
  }
  function closeAll(){
    detailFromAll=false;
    clearTimeout(openFormTimer);
    closeModal(formModal);closeModal(detailModal);closeModal(allModal);
    eating=false;serveScene.classList.remove('show','eating');
  }

  function resetBites(){
    for(var i=0;i<biteMarks.length;i++)biteMarks[i].classList.remove('on');
    if(biteMarksGroup)biteMarksGroup.style.opacity='1';
    servedSlice.style.opacity='1';
    servePlate.classList.remove('munch');
  }
  function serveCake(){
    clearTimeout(openFormTimer);
    biteStage=0;eating=true;
    resetBites();
    biteHint.textContent='点一下，吃一口 · 还剩 '+MAX_BITES+' 口';
    serveScene.classList.remove('show','eating');
    void serveScene.offsetWidth;
    serveScene.classList.add('show','eating');
  }
  function onBite(){
    if(!eating)return;
    biteStage++;
    burst(7);
    servePlate.classList.remove('munch');
    void servePlate.offsetWidth;
    servePlate.classList.add('munch');
    setTimeout(function(){servePlate.classList.remove('munch');},280);
    if(biteStage<biteMarks.length)biteMarks[biteStage].classList.add('on');
    if(biteStage>=MAX_BITES){
      eating=false;
      serveScene.classList.remove('eating');
      servedSlice.style.opacity='0';
      for(var j=0;j<biteMarks.length;j++)biteMarks[j].classList.remove('on');
      if(biteMarksGroup)biteMarksGroup.style.opacity='0';
      openFormTimer=setTimeout(openForm,560);
    }else{
      biteHint.textContent='点一下，吃一口 · 还剩 '+(MAX_BITES-biteStage)+' 口';
    }
  }
  function openForm(){clearForm();openModal(formModal);setTimeout(function(){nameInput.focus();},320);}
  function clearForm(){
    nameInput.value='';textInput.value='';imageInput.value='';pendingImg='';
    previewWrap.hidden=true;preview.style.backgroundImage='';
  }
  function openDetail(id,fromAll){
    detailFromAll=!!fromAll;
    var n=null;
    for(var i=0;i<notes.length;i++){if(notes[i].id===id){n=notes[i];break;}}
    if(!n)return;
    currentDetailId=id;
    detailTitle.textContent=(n.name?n.name+' 的祝福':'一位匿名朋友的祝福');
    detailBody.innerHTML='';
    if(n.img){var img=document.createElement('img');img.className='detail-img';img.src=n.img;img.alt='祝福配图';detailBody.appendChild(img);}
    var p=document.createElement('div');p.className='detail-text';p.textContent=n.text;detailBody.appendChild(p);
    var meta=document.createElement('div');meta.className='detail-meta';meta.textContent=n.time||'';detailBody.appendChild(meta);
    deleteBtn.hidden=!isAdmin;
    openModal(detailModal);
  }
  function openAll(){
    allList.innerHTML='';
    notes.slice().reverse().forEach(function(n){
      var b=document.createElement('button');b.type='button';b.className='list-item';
      var who=document.createElement('b');who.textContent=(n.name?n.name:'匿名朋友')+' · '+(n.time||'');
      var p=document.createElement('p');p.textContent=n.text;
      b.appendChild(who);b.appendChild(p);
      b.addEventListener('click',function(){closeModal(allModal);openDetail(n.id,true);});
      allList.appendChild(b);
    });
    clearBtn.hidden=!isAdmin;
    openModal(allModal);
  }
  function burst(count){
    var colors=['#DCA69E','#E9CFA1','#AEC0A9','#F3DAD1','#D8B98D'];
    var total=count||38;
    for(var i=0;i<total;i++){
      var s=document.createElement('span');s.className='confetti';
      s.style.left=(window.innerWidth/2+(Math.random()-.5)*90)+'px';
      s.style.top=(window.innerHeight*.58+(Math.random()-.5)*40)+'px';
      s.style.background=colors[i%colors.length];
      var dx=Math.round((Math.random()-.5)*520),dy=Math.round(120+Math.random()*380);
      s.style.setProperty('--dx',dx+'px');
      s.style.setProperty('--dy',dy+'px');
      s.style.setProperty('--dx1',Math.round(dx*.72)+'px');
      s.style.setProperty('--dy1',Math.round(dy*.5-48)+'px');
      s.style.animationDelay=(Math.random()*.18)+'s';
      document.body.appendChild(s);
      (function(node){setTimeout(function(){node.remove();},2100);})(s);
    }
  }
  imageInput.addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f)return;
    if(!/^image\//.test(f.type)){toast('请选择图片文件');return;}
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=720,w=img.width,h=img.height,scale=Math.min(1,max/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var ctx=c.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        try{pendingImg=c.toDataURL('image/jpeg',0.62);}catch(err){toast('这张图片处理失败，请换一张');return;}
        preview.style.backgroundImage='url("'+pendingImg+'")';previewWrap.hidden=false;
      };
      img.onerror=function(){toast('图片读取失败，请换一张');};
      img.src=reader.result;
    };
    reader.readAsDataURL(f);
  });
  $('removeImg').addEventListener('click',function(){
    pendingImg='';imageInput.value='';previewWrap.hidden=true;preview.style.backgroundImage='';
  });

  $('blessForm').addEventListener('submit',function(e){
    e.preventDefault();
    var text=textInput.value.trim();
    if(!text){textInput.focus();return;}
    var nickname=nameInput.value.trim();
    var note={id:'n'+Date.now()+Math.random().toString(36).slice(2,6),
      name:nickname,text:text,img:pendingImg,time:nowText(),deviceId:deviceId};
    notes.push(note);
    var saved=saveNotes();
    if(!saved&&note.img){note.img='';saveNotes();}
    publishNote(note);ntfyPublish(note);
    closeModal(formModal);eating=false;serveScene.classList.remove('show','eating');
    resetBites();
    stage.classList.add('cake-away');
    renderNotes();burst();
    toast(saved?'祝福已经落在蛋糕后面了':'祝福已显示，本机存储空间不足，照片未保存');
  });

  cakeBtn.addEventListener('click',function(){
    if(cut)return;
    cut=true;cakeArt.classList.add('cut');cakeBtn.disabled=true;hint.hidden=true;
    burst();serveCake();
  });
  servePlate.addEventListener('click',onBite);
  allBtn.addEventListener('click',openAll);
  $('writeBtn').addEventListener('click',function(){
    if(stage.classList.contains('cake-away')){openForm();return;}
    if(!cut){
      cut=true;cakeArt.classList.add('cut');cakeBtn.disabled=true;hint.hidden=true;
      burst();
    }
    serveCake();
  });
  deleteBtn.addEventListener('click',function(){
    var back=detailFromAll;
    notes=notes.filter(function(n){return n.id!==currentDetailId;});
    saveNotes();removeNoteTopic(currentDetailId);ntfyDelete(currentDetailId);closeModal(detailModal);detailFromAll=false;renderNotes();
    if(back)openAll();
    toast('这条祝福已经删除');
  });
  clearBtn.addEventListener('click',function(){
    if(!window.confirm('确定要清空所有祝福吗？此操作无法撤销。'))return;
    notes.forEach(function(n){if(!n.demo){removeNoteTopic(n.id);ntfyDelete(n.id);}});
    notes=notes.filter(function(n){return n.demo;});
    saveNotes();closeModal(allModal);renderNotes();toast('已清空你写下的祝福');
  });
  $('copyLink').addEventListener('click',function(){
    var url=window.location.href.split('#')[0];
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){toast('链接已复制，发给朋友吧');},function(){fallbackCopy(url);});
    }else{fallbackCopy(url);}
  });
  function fallbackCopy(url){
    var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('链接已复制，发给朋友吧');}catch(e){toast('复制失败，请手动复制地址栏链接');}
    ta.remove();
  }
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click',function(){
      if(this.getAttribute('data-close')==='detail')closeDetail();else closeAll();
    });
  });
  document.querySelectorAll('.modal').forEach(function(m){
    m.addEventListener('click',function(e){
      if(e.target!==m)return;
      if(m===detailModal)closeDetail();else closeAll();
    });
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(detailModal.classList.contains('show'))closeDetail();else closeAll();
  });
  window.addEventListener('resize',function(){
    clearTimeout(resizeTimer);resizeTimer=setTimeout(renderNotes,180);
  });

  function setCountdown(){
    var d=new Date(),year=d.getFullYear();
    var target=new Date(year,10,28,0,0,0);
    if(d.getTime()>target.getTime())target=new Date(year+1,10,28,0,0,0);
    var diff=target.getTime()-d.getTime();
    var days=Math.ceil(diff/86400000);
    $('dateLine').textContent=target.getFullYear()+' 年 11 月 28 日';
    $('countdown').textContent=days===0?'就是今天，生日快乐':('还有 '+days+' 天');
  }
  setCountdown();
  renderNotes();
  initShared();
  initNtfy();
})();
</script>
</body>
</html>
